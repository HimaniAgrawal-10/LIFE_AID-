<!DOCTYPE html>

<html>

<head>


<title>Hospital Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>

<div class="container mt-5">


<h2 class="mb-4 text-success">
    🏥 Available Hospitals
</h2>

{% if hospitals %}

<table class="table table-bordered table-striped">

    <thead class="table-dark">

        <tr>
            <th>Hospital</th>
            <th>City</th>
            <th>Address</th>
            <th>Phone</th>
        </tr>

    </thead>

    <tbody>

    {% for hospital in hospitals %}

        <tr>

            <td>{{ hospital[1] }}</td>
            <td>{{ hospital[2] }}</td>
            <td>{{ hospital[3] }}</td>
            <td>{{ hospital[4] }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% else %}

    <div class="alert alert-warning">
        No hospital found.
    </div>

{% endif %}

<a href="/search-hospital" class="btn btn-primary">
    Search Again
</a>

<a href="/dashboard" class="btn btn-secondary">
    Dashboard
</a>


</div>
<footer class="text-center mt-5 mb-3">

    <hr>

    <p>
        © 2026 LifeAid | Developed by Himani Agrawal
    </p>

</footer>
</body>

</html>
