<!DOCTYPE html>

<html>

<head>


<title>Search Blood Donor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>

<div class="container mt-5">


<div class="card p-4">

    <h2 class="text-primary">
        🔍 Search Blood Donor
    </h2>

    <form method="POST">

        <label>Blood Group</label>

        <select name="blood_group" class="form-select mb-3">

            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

        </select>

        <label>City</label>

        <input
        type="text"
        name="city"
        class="form-control mb-3"
        required>

        <button class="btn btn-primary w-100">
            Search Donor
        </button>

    </form>

    <hr>

    <a href="/dashboard" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>


</div>
<footer class="text-center mt-5 mb-3">

    <hr>

    <p>
        © 2026 LifeAid | Developed by Himani Agrawal
    </p>

</footer>
</body>

</html>
