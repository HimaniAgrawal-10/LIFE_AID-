<!DOCTYPE html>

<html>

<head>

<title>Donor Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>

<div class="container mt-5">


<h2 class="mb-4 text-danger">
    🩸 Available Blood Donors
</h2>

{% if donors %}

<table class="table table-bordered table-striped">

    <thead class="table-dark">

        <tr>
            <th>Name</th>
            <th>Blood Group</th>
            <th>City</th>
            <th>Phone</th>
        </tr>

    </thead>

    <tbody>

    {% for donor in donors %}

        <tr>

            <td>{{ donor[1] }}</td>
            <td>{{ donor[2] }}</td>
            <td>{{ donor[3] }}</td>
            <td>{{ donor[4] }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% else %}

    <div class="alert alert-warning">
        No donor found.
    </div>

{% endif %}

<a href="/search-donor" class="btn btn-primary">
    Search Again
</a>

<a href="/dashboard" class="btn btn-secondary">
    Dashboard
</a>


</div>
<footer class="text-center mt-5 mb-3">

    <hr>

    <p>
        © 2026 LifeAid | Developed by Himani Agrawal
    </p>

</footer>
</body>

</html>
