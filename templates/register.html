<!DOCTYPE html>

<html>

<head>


<title>Register - LifeAid</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>

<div class="container mt-5">


<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card p-4">

            <h2 class="text-center mb-4">
                🚑 User Registration
            </h2>

            <form method="POST">

                <label>Name</label>
                <input type="text"
                name="name"
                class="form-control mb-3"
                required>

                <label>Email</label>
                <input type="email"
                name="email"
                class="form-control mb-3"
                required>

                <label>Password</label>
                <input type="password"
                name="password"
                class="form-control mb-3"
                required>

                <label>City</label>
                <input type="text"
                name="city"
                class="form-control mb-3"
                required>

                <label>Language</label>

                <select
                name="language"
                class="form-select mb-3">

                    <option>English</option>
                    <option>Hindi</option>
                    <option>Urdu</option>
                    <option>Gujarati</option>
                    <option>Marathi</option>
                    <option>Punjabi</option>
                    <option>Bengali</option>
                    <option>Tamil</option>
                    <option>Telugu</option>

                </select>

                <button
                type="submit"
                class="btn btn-success w-100">

                    Register

                </button>

            </form>

            <hr>

            <p class="text-center">

                Already Registered?

                <a href="/login">
                    Login Here
                </a>

            </p>

        </div>

    </div>

</div>


</div>
<footer class="text-center mt-5 mb-3">

    <hr>

    <p>
        © 2026 LifeAid | Developed by Himani Agrawal
    </p>

</footer>
</body>

</html>
