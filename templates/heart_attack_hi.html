<h1>हार्ट अटैक आपातकाल</h1>

<ol>
    <li>तुरंत 108 या 112 पर कॉल करें।</li>
    <li>रोगी को आरामदायक स्थिति में बैठाएं।</li>
    <li>कसे हुए कपड़े ढीले करें।</li>
    <li>यदि उपलब्ध हो तो डॉक्टर की सलाह अनुसार एस्पिरिन दें।</li>
    <li>एम्बुलेंस आने तक निगरानी रखें।</li>
</ol>
