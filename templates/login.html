<!DOCTYPE html>

<html>

<head>


<title>Login - LifeAid</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>

<div class="container mt-5">

    
<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card p-4">

            <h2 class="text-center mb-4">
                🚑 LifeAid Login
            </h2>
 {% if success %}

<div class="alert alert-success">

    {{ success }}

</div>

{% endif %}

{% if error %}

<div class="alert alert-danger">

    {{ error }}

</div>

{% endif %}
            <form method="POST" action="/login">

                <label>Email</label>

                <input
                type="email"
                name="email"
                class="form-control mb-3"
                required>

                <label>Password</label>

                <input
                type="password"
                name="password"
                class="form-control mb-3"
                required>

                <button
                type="submit"
                class="btn btn-primary w-100">

                    Login

                </button>

            </form>

            <hr>

            <p class="text-center">

                New User?

                <a href="/register">
                    Register Here
                </a>

            </p>

        </div>

    </div>

</div>


</div>
<footer class="text-center mt-5 mb-3">

    <hr>

    <p>
        © 2026 LifeAid | Developed by Himani Agrawal
    </p>

</footer>
</body>

</html>
